openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /users:
    get:
      operationId: listTeam
      summary: Equipe e convites pendentes do negócio
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Equipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /users/invitations:
    post:
      operationId: inviteUser
      summary: Convida uma pessoa por e-mail
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                role: { type: string, enum: [manager, professional, reception] }
      responses:
        "201":
          description: Convite criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /users/invitations/{id}:
    delete:
      operationId: cancelInvitation
      summary: Cancela um convite pendente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Convite cancelado }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /users/{id}:
    patch:
      operationId: changeRole
      summary: Troca o papel de uma pessoa
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [manager, professional, reception] }
      responses:
        "200":
          description: Pessoa atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /users/{id}/deactivate:
    post:
      operationId: deactivateUser
      summary: Desativa uma pessoa (os acessos dela caem na hora)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Pessoa desativada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /users/{id}/reactivate:
    post:
      operationId: reactivateUser
      summary: Reativa uma pessoa desativada
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Pessoa reativada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Aceita o convite e entra
      description: Pessoa nova define a senha; quem já tem conta informa a senha atual. Token inválido, expirado ou de outro negócio dá sempre a mesma resposta 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, accept_terms]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                accept_terms: { type: boolean, description: "Deve ser verdadeiro: quem aceita o convite aceita os termos de uso." }
                password: { type: string, minLength: 12, description: "De 12 caracteres até 72 bytes (limite do bcrypt)." }
      responses:
        "200":
          description: Sessão (ou desafio de 2FA)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Session" }
                  - { $ref: "#/components/schemas/Challenge" }
        "422": { $ref: "#/components/responses/Problem" }
        "423": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Team:
      type: object
      required: [members, invitations]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        invitations:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
    Member:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, manager, professional, reception] }
        status: { type: string, enum: [active, inactive] }
    Invitation:
      type: object
      required: [id, name, email, role, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [manager, professional, reception] }
        status: { type: string, enum: [invited] }
        expires_at: { type: string, format: date-time }
    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        user: { type: object }
    Challenge:
      type: object
      required: [challenge_token, next, expires_at]
      properties:
        challenge_token: { type: string }
        next: { type: string, enum: [verify, setup] }
        expires_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors: { type: object }
