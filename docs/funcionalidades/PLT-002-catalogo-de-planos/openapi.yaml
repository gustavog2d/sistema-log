openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /plans:
    get:
      operationId: listPublicPlans
      summary: Planos ativos (público)
      responses:
        "200":
          description: Planos ativos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicPlan"
  /platform/plans:
    get:
      operationId: platformListPlans
      summary: Todos os planos
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Planos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: platformCreatePlan
      summary: Cria plano
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreateInput"
      responses:
        "201":
          description: Plano criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /platform/plans/{plan}:
    parameters:
      - { name: plan, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: platformGetPlan
      summary: Detalhe do plano
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Plano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: platformUpdatePlan
      summary: Altera o plano
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdateInput"
      responses:
        "200":
          description: Plano alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /platform/plans/{plan}/entitlements:
    parameters:
      - { name: plan, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: platformPlanEntitlements
      summary: Resultado calculado por funcionalidade
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entitlement"
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /platform/plans/{plan}/features/{feature}:
    parameters:
      - { name: plan, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: feature, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: platformSetPlanFeature
      summary: Define a regra do plano para a funcionalidade
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanFeatureInput"
      responses:
        "200":
          description: Regra definida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlement"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: platformResetPlanFeature
      summary: Volta ao padrão da funcionalidade
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Regra removida }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /platform/features:
    get:
      operationId: platformListFeatures
      summary: Catálogo de funcionalidades
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Funcionalidades
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Feature"
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: platformCreateFeature
      summary: Cria funcionalidade
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureCreateInput"
      responses:
        "201":
          description: Funcionalidade criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /platform/features/{feature}:
    parameters:
      - { name: feature, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: platformUpdateFeature
      summary: Altera a funcionalidade
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureUpdateInput"
      responses:
        "200":
          description: Funcionalidade alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Plan:
      type: object
      required: [id, key, name, position, status, trial_days, currency, monthly_price_cents, yearly_discount_percent, yearly_price_cents]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        position: { type: integer }
        status: { type: string, enum: [draft, active, archived] }
        trial_days: { type: integer }
        currency: { type: string }
        monthly_price_cents: { type: [integer, "null"] }
        yearly_discount_percent: { type: [integer, "null"] }
        yearly_price_cents: { type: [integer, "null"] }
    PublicPlan:
      type: object
      description: Só planos ativos, que sempre têm preço mensal e desconto anual definidos.
      required: [key, name, position, trial_days, currency, monthly_price_cents, yearly_price_cents, features]
      properties:
        key: { type: string }
        name: { type: string }
        position: { type: integer }
        trial_days: { type: integer }
        currency: { type: string }
        monthly_price_cents: { type: integer }
        yearly_price_cents: { type: integer }
        features:
          type: array
          items:
            $ref: "#/components/schemas/PublicEntitlement"
    PlanCreateInput:
      type: object
      required: [key, name]
      description: A moeda (currency) é sempre BRL e não é editável. A chave não muda depois de criada.
      properties:
        key: { type: string, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$", maxLength: 40 }
        name: { type: string, maxLength: 100 }
        position: { type: integer, minimum: 0, maximum: 32767 }
        status: { type: string, enum: [draft, active, archived] }
        trial_days: { type: integer, minimum: 0, maximum: 365 }
        monthly_price_cents: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        yearly_discount_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
    PlanUpdateInput:
      type: object
      description: Plano arquivado não volta a rascunho nem a ativo. Ativar exige preço mensal e desconto anual.
      properties:
        name: { type: string, maxLength: 100 }
        position: { type: integer, minimum: 0, maximum: 32767 }
        status: { type: string, enum: [draft, active, archived] }
        trial_days: { type: integer, minimum: 0, maximum: 365 }
        monthly_price_cents: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        yearly_discount_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
    Feature:
      type: object
      required: [id, key, name, description, kind, default_enabled, default_limit, default_visible]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        kind: { type: string, enum: [toggle, limit] }
        default_enabled: { type: boolean }
        default_limit: { type: [integer, "null"] }
        default_visible: { type: boolean }
    FeatureCreateInput:
      type: object
      required: [key, name, kind, default_enabled, default_visible]
      properties:
        key: { type: string, pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$", maxLength: 60 }
        name: { type: string, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 500 }
        kind: { type: string, enum: [toggle, limit] }
        default_enabled: { type: boolean }
        default_limit: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
        default_visible: { type: boolean }
    FeatureUpdateInput:
      type: object
      description: A chave não muda. Funcionalidade do tipo toggle não aceita limite; ao virar toggle, os limites das regras são zerados.
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 500 }
        kind: { type: string, enum: [toggle, limit] }
        default_enabled: { type: boolean }
        default_limit: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
        default_visible: { type: boolean }
    PlanFeatureInput:
      type: object
      required: [enabled, visible]
      properties:
        enabled: { type: boolean }
        limit: { type: [integer, "null"], minimum: 0, maximum: 1000000 }
        visible: { type: boolean }
    Entitlement:
      type: object
      description: Uma funcionalidade liberada sempre sai com visible verdadeiro, mesmo que a regra guardada diga o contrário.
      required: [feature, enabled, limit, visible, source]
      properties:
        feature: { type: string }
        enabled: { type: boolean }
        limit: { type: [integer, "null"] }
        visible: { type: boolean }
        source: { type: string, enum: [default, plan, override] }
    PublicEntitlement:
      type: object
      required: [feature, enabled, limit]
      properties:
        feature: { type: string }
        enabled: { type: boolean }
        limit: { type: [integer, "null"] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
