openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /leads:
    post:
      operationId: createLead
      summary: Captura um lead da landing (público)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadRequest" }
      responses:
        "202": { description: "Recebido (a resposta é a mesma para lead novo, repetido ou barrado pelo campo isca)" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /platform/leads:
    get:
      operationId: listLeads
      summary: Lista os leads (equipe da plataforma)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [new, contacted, converted, discarded] } }
        - { name: utm_source, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /platform/leads/{id}:
    patch:
      operationId: updateLead
      summary: Altera o status e as notas de um lead (equipe da plataforma)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [new, contacted, converted, discarded] }
                notes: { type: [string, "null"], maxLength: 1000 }
      responses:
        "200":
          description: Lead atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    LeadRequest:
      type: object
      required: [name, email, accept_privacy, captcha_token]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: [string, "null"], pattern: "^\\+[1-9][0-9]{7,14}$", description: Telefone em E.164 }
        niche: { type: [string, "null"], enum: [tatuagem, manicure, barbearia, estetica_automotiva, null] }
        message: { type: [string, "null"], maxLength: 500 }
        utm_source: { type: [string, "null"], maxLength: 100 }
        utm_medium: { type: [string, "null"], maxLength: 100 }
        utm_campaign: { type: [string, "null"], maxLength: 100 }
        utm_term: { type: [string, "null"], maxLength: 100 }
        utm_content: { type: [string, "null"], maxLength: 100 }
        referrer: { type: [string, "null"], maxLength: 255 }
        landing_path: { type: [string, "null"], maxLength: 255 }
        accept_privacy: { type: boolean, const: true }
        captcha_token: { type: string, maxLength: 4000 }
        website: { type: [string, "null"], description: Campo isca; deve ficar vazio }
    Lead:
      type: object
      required: [id, name, email, phone, niche, message, utm_source, utm_medium, utm_campaign, utm_term, utm_content, referrer, landing_path, status, notes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        niche: { type: [string, "null"] }
        message: { type: [string, "null"] }
        utm_source: { type: [string, "null"] }
        utm_medium: { type: [string, "null"] }
        utm_campaign: { type: [string, "null"] }
        utm_term: { type: [string, "null"] }
        utm_content: { type: [string, "null"] }
        referrer: { type: [string, "null"] }
        landing_path: { type: [string, "null"] }
        status: { type: string, enum: [new, contacted, converted, discarded] }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LeadPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Lead" }
        next_cursor: { type: [string, "null"] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: object }
