openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /appointments/{id}/payments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listAppointmentPayments
      summary: Pagamentos do agendamento e o resumo
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pagamentos por data e o resumo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentList" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPayment
      summary: Registra um pagamento recebido
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Pagamento registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /payments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePayment
      summary: Corrige tipo, forma e data de um pagamento recebido
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentPatch" }
      responses:
        "200":
          description: Pagamento atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /payments/{id}/void:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: voidPayment
      summary: Estorna um pagamento
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pagamento estornado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Payment:
      type: object
      required: [id, appointment_id, type, method, amount_cents, paid_at, status, voided_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        type: { type: string, enum: [deposit, installment, final] }
        method: { type: string, enum: [cash, pix, credit_card, debit_card, other] }
        amount_cents: { type: integer, minimum: 1, maximum: 100000000 }
        paid_at: { type: string, format: date-time }
        status: { type: string, enum: [received, voided] }
        voided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaymentSummary:
      type: object
      required: [total_cents, received_cents, remaining_cents, payment_status, commission_percent, commission_cents]
      properties:
        total_cents: { type: integer }
        received_cents: { type: integer }
        remaining_cents: { type: integer }
        payment_status: { type: string, enum: [no_value, unpaid, partial, paid] }
        commission_percent: { type: number }
        commission_cents: { type: integer }
    PaymentList:
      type: object
      required: [data, summary]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        summary: { $ref: "#/components/schemas/PaymentSummary" }
    PaymentInput:
      type: object
      required: [type, method, amount_cents]
      properties:
        type: { type: string, enum: [deposit, installment, final] }
        method: { type: string, enum: [cash, pix, credit_card, debit_card, other] }
        amount_cents: { type: integer, minimum: 1, maximum: 100000000 }
        paid_at: { type: string, format: date-time, description: Padrão agora; até 5 minutos no futuro }
    PaymentPatch:
      type: object
      properties:
        type: { type: string, enum: [deposit, installment, final] }
        method: { type: string, enum: [cash, pix, credit_card, debit_card, other] }
        paid_at: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        remaining_cents: { type: integer }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
