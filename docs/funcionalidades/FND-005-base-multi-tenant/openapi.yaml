openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /tenant/current:
    get:
      operationId: getCurrentTenant
      summary: Tenant resolvido pelo host da requisição
      responses:
        "200":
          description: Dados públicos do tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Host sem tenant correspondente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Tenant:
      type: object
      required: [id, name, slug, timezone, currency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        currency:
          type: string
    Problem:
      type: object
      description: Problem Details (RFC 9457)
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
