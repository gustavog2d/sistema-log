openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /platform/auth/login:
    post:
      operationId: platformLogin
      summary: Senha → token de desafio (2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Senha correta; falta o segundo fator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "423":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /platform/auth/2fa/verify:
    post:
      operationId: platformVerifyTwoFactor
      summary: Código TOTP ou de recuperação → token de acesso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Token de acesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "423":
          $ref: "#/components/responses/Problem"
  /platform/2fa/setup:
    post:
      operationId: platformTwoFactorSetup
      summary: Gera o segredo e a URI do 2FA
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Segredo para o app autenticador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetup"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /platform/2fa/confirm:
    post:
      operationId: platformTwoFactorConfirm
      summary: Confirma o 2FA e devolve os códigos de recuperação
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: 2FA ativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorConfirmed"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "423":
          $ref: "#/components/responses/Problem"
  /platform/me:
    get:
      operationId: platformMe
      summary: Perfil de quem está logado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /platform/auth/logout:
    post:
      operationId: platformLogout
      summary: Revoga o token usado
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Token revogado
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Código TOTP de 6 dígitos ou código de recuperação
    Challenge:
      type: object
      required: [challenge_token, next, expires_at]
      properties:
        challenge_token:
          type: string
        next:
          type: string
          enum: [verify, setup]
        expires_at:
          type: string
          format: date-time
    AccessToken:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
    TwoFactorSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
    TwoFactorConfirmed:
      type: object
      required: [recovery_codes, access_token, token_type, expires_at]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
    PlatformUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [super_admin, suporte]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
