openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /subscription/plan-change/preview:
    get:
      operationId: previewPlanChange
      summary: Simula a troca de plano sem gravar (dona)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: plan, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Simulação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanChangePreview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /subscription/plan:
    put:
      operationId: changePlan
      summary: Troca de plano (upgrade vale na hora; downgrade no fim do período)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, description: Chave de um plano ativo }
      responses:
        "200":
          description: Troca aplicada ou agendada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanChangeResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "402": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /subscription/plan-change:
    delete:
      operationId: cancelPlanChange
      summary: Desfaz a troca de plano agendada
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Troca desfeita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionState" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    PendingPlanChange:
      type: [object, "null"]
      required: [plan, price_cents, effective_at]
      properties:
        plan:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        price_cents: { type: integer }
        effective_at: { type: string, format: date-time }
    Violation:
      type: object
      required: [feature, limit, usage]
      properties:
        feature: { type: string }
        limit: { type: integer }
        usage: { type: integer }
    PlanChangePreview:
      type: object
      required: [kind, plan, price_cents, currency, charge_now_cents, effective_at, violations]
      properties:
        kind: { type: string, enum: [now, next_cycle] }
        plan:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        price_cents: { type: integer }
        currency: { type: string }
        charge_now_cents: { type: integer }
        effective_at: { type: string, format: date-time }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
    SubscriptionState:
      type: object
      required: [status, cancel_at_period_end, can_write, current_period_end, payment_method, pending_plan_change]
      properties:
        status: { type: string, enum: [trialing, active, suspended, canceled] }
        cancel_at_period_end: { type: boolean }
        can_write: { type: boolean }
        current_period_end: { type: [string, "null"], format: date-time }
        payment_method:
          type: [object, "null"]
          required: [type, brand, last4]
          properties:
            type: { type: string }
            brand: { type: [string, "null"] }
            last4: { type: [string, "null"] }
        pending_plan_change: { $ref: "#/components/schemas/PendingPlanChange" }
    PlanChangeResult:
      allOf:
        - { $ref: "#/components/schemas/SubscriptionState" }
        - type: object
          required: [plan_change]
          properties:
            plan_change:
              type: object
              required: [kind, plan, price_cents, charged_cents, effective_at]
              properties:
                kind: { type: string, enum: [now, next_cycle] }
                plan:
                  type: object
                  required: [key, name]
                  properties:
                    key: { type: string }
                    name: { type: string }
                price_cents: { type: integer }
                charged_cents: { type: integer }
                effective_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors: { type: object }
        violations:
          type: array
          items: { $ref: "#/components/schemas/Violation" }
