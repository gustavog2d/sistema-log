openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /services:
    get:
      operationId: listServices
      summary: Lista serviços do negócio
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de serviços
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServicePage" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createService
      summary: Cria um serviço (dona e gerente)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "201":
          description: Serviço criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /services/presets:
    post:
      operationId: applyServicePreset
      summary: Cria os serviços e categorias iniciais do nicho do negócio
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: O que foi criado e o que já existia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /services/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getService
      summary: Detalhe do serviço
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Serviço
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateService
      summary: Edita o serviço (inclui arquivar e reativar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServicePatch" }
      responses:
        "200":
          description: Serviço atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteService
      summary: Exclui o serviço (se nunca foi usado)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Serviço excluído }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /service-categories:
    get:
      operationId: listServiceCategories
      summary: Lista as categorias com a contagem de serviços
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Categorias
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCategory" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createServiceCategory
      summary: Cria uma categoria (dona e gerente)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCategoryInput" }
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCategory" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /service-categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateServiceCategory
      summary: Renomeia a categoria
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceCategoryInput" }
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceCategory" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteServiceCategory
      summary: Exclui a categoria (só se não tem serviços)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Categoria excluída }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Service:
      type: object
      required: [id, name, description, category_id, duration_minutes, price_cents, buffer_before_minutes, buffer_after_minutes, requires_deposit, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        category_id: { type: [string, "null"], format: uuid }
        duration_minutes: { type: integer }
        price_cents: { type: [integer, "null"], description: Vazio significa sob orçamento }
        buffer_before_minutes: { type: integer }
        buffer_after_minutes: { type: integer }
        requires_deposit: { type: boolean }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceInput:
      type: object
      required: [name, duration_minutes]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 500 }
        category_id: { type: [string, "null"], format: uuid }
        duration_minutes: { type: integer, minimum: 5, maximum: 720, multipleOf: 5 }
        price_cents: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 240, multipleOf: 5 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 240, multipleOf: 5 }
        requires_deposit: { type: boolean }
        status: { type: string, enum: [active, archived] }
    ServicePatch:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 500 }
        category_id: { type: [string, "null"], format: uuid }
        duration_minutes: { type: integer, minimum: 5, maximum: 720, multipleOf: 5 }
        price_cents: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 240, multipleOf: 5 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 240, multipleOf: 5 }
        requires_deposit: { type: boolean }
        status: { type: string, enum: [active, archived] }
    ServicePage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Service" }
        next_cursor: { type: [string, "null"] }
    ServiceCategory:
      type: object
      required: [id, name, services_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        services_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ServiceCategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
    PresetResult:
      type: object
      required: [niche, created, skipped]
      properties:
        niche: { type: string }
        created:
          type: object
          required: [categories, services]
          properties:
            categories: { type: integer }
            services: { type: integer }
        skipped:
          type: object
          required: [categories, services]
          properties:
            categories: { type: integer }
            services: { type: integer }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        count: { type: integer }
        errors: { type: object }
