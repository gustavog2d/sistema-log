openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /appointments:
    get:
      operationId: listAppointments
      summary: Agendamentos que tocam o período
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
        - { name: client_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, scheduled, completed, canceled, no_show] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: Agendamentos por início
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAppointment
      summary: Cria um agendamento
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "201":
          description: Agendamento criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /appointments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAppointment
      summary: Detalhe do agendamento
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Agendamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateAppointment
      summary: Edita, remarca e muda a situação
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentInput" }
      responses:
        "200":
          description: Agendamento atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAppointment
      summary: Exclui o agendamento (dona e gerente; não o finalizado)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Agendamento excluído }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /professionals/{id}/availability:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAvailability
      summary: Horários livres do dia
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: service_id, in: query, schema: { type: string, format: uuid } }
        - { name: duration_minutes, in: query, schema: { type: integer, minimum: 5, maximum: 720 } }
      responses:
        "200":
          description: Inícios possíveis
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [starts_at, ends_at]
                      properties:
                        starts_at: { type: string, format: date-time }
                        ends_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Appointment:
      type: object
      required: [id, client, professional, service, starts_at, ends_at, description, status, type, origin, session_number, sessions_total, value_total_cents, notes, client_review, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        client:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        professional:
          type: object
          required: [id, name, color]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            color: { type: string }
        service:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        description: { type: [string, "null"] }
        status: { type: string, enum: [pending, scheduled, completed, canceled, no_show] }
        type: { type: string, enum: [appointment, retouch] }
        origin: { type: string, enum: [panel, public_link, app] }
        session_number: { type: [integer, "null"] }
        sessions_total: { type: [integer, "null"] }
        value_total_cents: { type: [integer, "null"], description: Nulo para a recepção (sem financeiro) }
        notes: { type: [string, "null"] }
        client_review: { type: [integer, "null"], minimum: 1, maximum: 5 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AppointmentInput:
      type: object
      properties:
        client_id: { type: string, format: uuid }
        professional_id: { type: string, format: uuid }
        service_id: { type: [string, "null"], format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        description: { type: [string, "null"], maxLength: 255 }
        status: { type: string, enum: [pending, scheduled, completed, canceled, no_show] }
        type: { type: string, enum: [appointment, retouch] }
        session_number: { type: [integer, "null"], minimum: 1, maximum: 99 }
        sessions_total: { type: [integer, "null"], minimum: 1, maximum: 99 }
        value_total_cents: { type: [integer, "null"], minimum: 0, maximum: 100000000 }
        notes: { type: [string, "null"], maxLength: 2000 }
        client_review: { type: [integer, "null"], minimum: 1, maximum: 5 }
        allow_outside_hours: { type: boolean, description: Confirma o encaixe fora do expediente ou em folga }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors: { type: object }
        reasons:
          type: array
          items: { type: string, enum: [outside_working_hours, time_off] }
        conflict:
          type: object
          properties:
            id: { type: string, format: uuid }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
