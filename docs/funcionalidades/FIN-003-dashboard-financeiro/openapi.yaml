openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /finance/summary:
    get:
      operationId: getFinanceSummary
      summary: Resumo financeiro do período
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSummary" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /finance/monthly:
    get:
      operationId: getFinanceMonthly
      summary: Balanço dos 12 meses que terminam no mês informado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: to, in: query, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
      responses:
        "200":
          description: Doze meses, do mais antigo ao mais novo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMonthly" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /finance/calendar:
    get:
      operationId: getFinanceCalendar
      summary: Movimento de cada dia do mês
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
      responses:
        "200":
          description: Todos os dias do mês
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceCalendar" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /finance/goal:
    get:
      operationId: getFinanceGoal
      summary: Meta mensal
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Meta (nula se não definida)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceGoal" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setFinanceGoal
      summary: Define ou limpa a meta mensal
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceGoal" }
      responses:
        "200":
          description: Meta gravada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceGoal" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    FinanceSummary:
      type: object
      required: [received_cents, expected_cents, to_receive_cents, commission_received_cents, net_received_cents, commission_expected_cents, net_expected_cents, expenses_cents, result_cents, appointments_count, by_method]
      properties:
        received_cents: { type: integer }
        expected_cents: { type: integer }
        to_receive_cents: { type: integer, minimum: 0 }
        commission_received_cents: { type: integer }
        net_received_cents: { type: integer }
        commission_expected_cents: { type: integer }
        net_expected_cents: { type: integer }
        expenses_cents: { type: integer }
        result_cents: { type: integer }
        appointments_count: { type: integer }
        by_method:
          type: array
          items:
            type: object
            required: [method, total_cents]
            properties:
              method: { type: string, enum: [cash, pix, credit_card, debit_card, other] }
              total_cents: { type: integer }
    FinanceMonth:
      type: object
      required: [month, received_cents, net_received_cents, expected_cents, expenses_cents, result_cents]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        received_cents: { type: integer }
        net_received_cents: { type: integer }
        expected_cents: { type: integer }
        expenses_cents: { type: integer }
        result_cents: { type: integer }
    FinanceMonthly:
      type: object
      required: [months, totals]
      properties:
        months:
          type: array
          items: { $ref: "#/components/schemas/FinanceMonth" }
        totals:
          type: object
          required: [received_cents, net_received_cents, expected_cents, expenses_cents, result_cents]
          properties:
            received_cents: { type: integer }
            net_received_cents: { type: integer }
            expected_cents: { type: integer }
            expenses_cents: { type: integer }
            result_cents: { type: integer }
    FinanceDay:
      type: object
      required: [date, received_cents, expected_cents, appointments_count, expenses_cents]
      properties:
        date: { type: string, format: date }
        received_cents: { type: integer }
        expected_cents: { type: integer }
        appointments_count: { type: integer }
        expenses_cents: { type: integer }
    FinanceCalendar:
      type: object
      required: [month, days]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        days:
          type: array
          items: { $ref: "#/components/schemas/FinanceDay" }
    FinanceGoal:
      type: object
      required: [monthly_goal_cents]
      properties:
        monthly_goal_cents: { type: [integer, "null"], minimum: 1, maximum: 1000000000 }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
