openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /platform/coupons:
    get:
      operationId: listCoupons
      summary: Lista os cupons (equipe da plataforma)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cupons
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Coupon" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCoupon
      summary: Cria um cupom (super admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponCreate" }
      responses:
        "201":
          description: Cupom criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /platform/coupons/{id}:
    patch:
      operationId: updateCoupon
      summary: Altera status, limite, validade ou descrição (super admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponUpdate" }
      responses:
        "200":
          description: Cupom alterado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /signup/coupon-check:
    post:
      operationId: checkCoupon
      summary: Mostra o preço final com o cupom, sem consumi-lo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, plan, cycle]
              properties:
                code: { type: string, maxLength: 40 }
                plan: { type: string }
                cycle: { type: string, enum: [monthly, yearly] }
      responses:
        "200":
          description: Cupom disponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponQuote" }
        "422":
          description: Cupom indisponível (erro na chave `code`, ao contrário do cadastro, que usa `coupon_code`) ou dados inválidos
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Coupon:
      type: object
      required: [id, code, percent_off, status, max_redemptions, redeemed_count, valid_from, valid_until, description, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        percent_off: { type: integer, minimum: 1, maximum: 100 }
        status: { type: string, enum: [active, inactive] }
        max_redemptions: { type: [integer, "null"] }
        redeemed_count: { type: integer }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    CouponCreate:
      type: object
      required: [code, percent_off]
      properties:
        code: { type: string, minLength: 3, maxLength: 40, pattern: "^[A-Za-z0-9-]+$" }
        percent_off: { type: integer, minimum: 1, maximum: 100 }
        max_redemptions: { type: [integer, "null"], minimum: 1 }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        description: { type: [string, "null"], maxLength: 200 }
    CouponUpdate:
      type: object
      properties:
        status: { type: string, enum: [active, inactive] }
        max_redemptions: { type: [integer, "null"], minimum: 1 }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        description: { type: [string, "null"], maxLength: 200 }
    CouponQuote:
      type: object
      required: [percent_off, price_cents, final_price_cents, currency, requires_payment_method]
      properties:
        percent_off: { type: integer }
        price_cents: { type: integer }
        final_price_cents: { type: integer }
        currency: { type: string }
        requires_payment_method: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: object }
