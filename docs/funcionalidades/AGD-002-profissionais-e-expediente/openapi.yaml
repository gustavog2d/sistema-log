openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /professionals:
    get:
      operationId: listProfessionals
      summary: Lista profissionais do negócio
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, all], default: active } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de profissionais
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfessionalPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProfessional
      summary: Cria um profissional (dona e gerente)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalInput" }
      responses:
        "201":
          description: Profissional criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Professional" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /professionals/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProfessional
      summary: Detalhe do profissional
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profissional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Professional" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProfessional
      summary: Edita o profissional (inclui ativar e desativar)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalInput" }
      responses:
        "200":
          description: Profissional atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Professional" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteProfessional
      summary: Exclui o profissional e o expediente dele
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Profissional excluído }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /professionals/{id}/working-hours:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWorkingHours
      summary: Expediente semanal do profissional
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Faixas ordenadas por dia e início
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkingHours" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setWorkingHours
      summary: Substitui o expediente inteiro (dona e gerente)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ranges]
              properties:
                ranges:
                  type: array
                  maxItems: 70
                  items: { $ref: "#/components/schemas/WorkingRange" }
      responses:
        "200":
          description: Expediente novo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkingHours" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /time-offs:
    get:
      operationId: listTimeOffs
      summary: Lista folgas (da pessoa e do negócio todo)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Página de folgas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeOffPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTimeOff
      summary: Cria uma folga (dona e gerente)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeOffInput" }
      responses:
        "201":
          description: Folga criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeOff" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /time-offs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateTimeOff
      summary: Edita a folga
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeOffInput" }
      responses:
        "200":
          description: Folga atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeOff" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTimeOff
      summary: Exclui a folga
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Folga excluída }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Professional:
      type: object
      required: [id, name, color, commission_percent, user_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^#[0-9A-F]{6}$" }
        commission_percent: { type: [integer, "null"], minimum: 0, maximum: 100, description: "Dado financeiro: só dona, gerente e o próprio profissional veem; nos demais papéis vem nulo" }
        user_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProfessionalInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        commission_percent: { type: integer, minimum: 0, maximum: 100 }
        user_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [active, inactive] }
    ProfessionalPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Professional" }
        next_cursor: { type: [string, "null"] }
    WorkingRange:
      type: object
      required: [weekday, start, end]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = domingo }
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$" }
    WorkingHours:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkingRange" }
    TimeOff:
      type: object
      required: [id, professional_id, starts_at, ends_at, reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        professional_id: { type: [string, "null"], format: uuid, description: Vazio = o negócio todo }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TimeOffInput:
      type: object
      properties:
        professional_id: { type: [string, "null"], format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 100 }
    TimeOffPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TimeOff" }
        next_cursor: { type: [string, "null"] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors: { type: object }
