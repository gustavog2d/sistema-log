openapi: 3.1.0
info:
  title: API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /subscription:
    get:
      operationId: getSubscription
      summary: Status da assinatura do negócio (exige login; permitido mesmo suspenso)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Assinatura do negócio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de acesso do assinante (PLT-006).
  responses:
    SubscriptionBlocked:
      description: >-
        Escrita bloqueada: a assinatura está suspensa ou cancelada (somente leitura). TODA rota do assinante que
        grava dados deve declarar este 403 (o middleware subscription.access o devolve).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/SubscriptionBlocked"
    Problem:
      description: Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Subscription:
      type: object
      required: [status, plan, cycle, price_cents, currency, trial_ends_at, current_period_end, next_charge_at, suspended_at, can_write, payment_method, cancel_at_period_end]
      properties:
        status: { type: string, enum: [trialing, active, suspended, canceled] }
        plan:
          type: object
          required: [key, name]
          properties:
            key: { type: string }
            name: { type: string }
        cycle: { type: string, enum: [monthly, yearly] }
        price_cents: { type: integer }
        currency: { type: string }
        trial_ends_at: { type: [string, "null"], format: date-time }
        current_period_end: { type: [string, "null"], format: date-time }
        next_charge_at: { type: [string, "null"], format: date-time, description: Quando a próxima cobrança será tentada; nulo se suspensa ou cancelada }
        suspended_at: { type: [string, "null"], format: date-time }
        can_write: { type: boolean, description: Falso quando a assinatura está suspensa ou cancelada (somente leitura) }
        payment_method:
          type: [object, "null"]
          description: Meio de pagamento atual (nunca a referência do gateway)
          required: [type, brand, last4]
          properties:
            type: { type: string }
            brand: { type: [string, "null"] }
            last4: { type: [string, "null"] }
        cancel_at_period_end: { type: boolean, description: Verdadeiro quando há cancelamento pedido e ainda não efetivado (PLT-007) }
    SubscriptionBlocked:
      type: object
      description: Corpo do 403 de escrita bloqueada (Problem Details com `code`)
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, enum: [403] }
        detail: { type: string }
        code: { type: string, enum: [subscription_suspended, subscription_canceled] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
