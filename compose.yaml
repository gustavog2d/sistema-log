name: app

x-api: &api
  build: docker/api
  working_dir: /workspace/apps/api
  volumes:
    - .:/workspace
  environment: &api-env
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USERNAME: ${DB_USERNAME:-app_runtime}
    DB_PASSWORD: ${DB_PASSWORD:-app_runtime}
    DB_ADMIN_USERNAME: ${DB_ADMIN_USERNAME:-app}
    DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-app}
    APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-localhost}
    DB_DATABASE: ${DB_DATABASE:-app}
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  api:
    <<: *api
    command: sh /workspace/docker/api/start.sh
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:8000/api/v1/health | grep -q '"status":"ok"'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  worker:
    <<: *api
    command: php artisan queue:work --tries=3 --sleep=1
    depends_on:
      api: { condition: service_healthy }

  web:
    build: docker/web
    working_dir: /workspace
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter web dev"
    volumes:
      - .:/workspace
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-App}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:3000/']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-app}
      POSTGRES_DB: ${DB_DATABASE:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_ADMIN_USERNAME:-app} -d ${DB_DATABASE:-app}',
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'

volumes:
  pgdata:
